<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Tiny Surprise 🎁</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Trebuchet MS',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;

background:linear-gradient(
-45deg,
#ff9a9e,
#fad0c4,
#fbc2eb,
#a1c4fd,
#c2ffd8,
#fff1a8
);

background-size:500% 500%;
animation:bg 15s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}


.card{

width:90%;
max-width:420px;

background:rgba(255,255,255,0.92);

backdrop-filter:blur(12px);

padding:32px 25px;

border-radius:30px;

text-align:center;

box-shadow:
0 20px 50px rgba(0,0,0,.18);

animation:pop 1s;

z-index:2;

border:2px solid rgba(255,255,255,.7);

}


@keyframes pop{

from{
opacity:0;
transform:translateY(30px) scale(.9);
}

to{
opacity:1;
transform:translateY(0) scale(1);
}

}


h1{

color:#ff4f87;

font-size:28px;

margin-bottom:20px;

}


.note{

background:#fff8fc;

padding:22px;

border-radius:20px;

box-shadow:inset 0 0 15px rgba(255,180,210,.3);

}


p{

font-size:17px;

line-height:1.8;

color:#555;

}


.highlight{

color:#ff4f87;

font-weight:bold;

}


button{

margin-top:25px;

padding:15px 38px;

border:none;

border-radius:35px;

font-size:18px;

font-weight:bold;

background:#ff4f87;

color:white;

cursor:pointer;

box-shadow:0 8px 20px rgba(255,79,135,.4);

animation:pulse 1.8s infinite;

}


@keyframes pulse{

50%{
transform:scale(1.07);
}

}


.flower{

position:absolute;

font-size:28px;

animation:fall linear infinite;

}


@keyframes fall{

0%{
transform:translateY(-10vh) rotate(0deg);
}

100%{
transform:translateY(110vh) rotate(360deg);
}

}


</style>

</head>


<body>


<div class="card">


<h1>
💌 Hey Baunipie!! 🌸
</h1>


<div class="note">

<p>

✨ <span class="highlight">Happy Friendship Day!!</span> ✨

<br><br>

Okay... so you finally opened this. 👀😂

<br><br>

This is not some boring long message. ❌

Not a dramatic speech. ❌

And definitely not your homework. 😂📚

<br><br>

It's just a little surprise from a friend...

A
