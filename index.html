<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A Small Surprise 🎁</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ffd6e7,#fff4b3,#d8ffd8);
overflow:hidden;
}

.card{
background:#fff;
width:85%;
max-width:420px;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
color:#ff5f93;
font-size:32px;
margin-bottom:10px;
}

p{
font-size:18px;
line-height:1.6;
color:#444;
}

button{
margin-top:20px;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
background:#ff6fa5;
color:white;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

.flower{
position:absolute;
font-size:24px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-10vh);
}
100%{
transform:translateY(110vh);
}
}
</style>

</head>

<body>
